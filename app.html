<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four in a Row - the classic, with a real AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#101426; color:#e5ebff; min-height:100vh; padding-bottom:50px; }
  header { text-align:center; padding:28px 16px 4px; }
  header h1 { font-size:30px; font-weight:800; }
  header h1 span { color:#fbbf24; }
  header p { color:#6b7699; margin-top:6px; font-size:15px; }
  .wrap { max-width:560px; margin:0 auto; padding:0 16px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:14px 0 10px; font-size:14px; color:#6b7699; flex-wrap:wrap; gap:8px; }
  .bar b { color:#fbbf24; }
  .btns button, .btns select { background:#1a2140; border:1px solid #2c3866; color:#aeb9e8; font-size:13px; font-weight:600; padding:8px 12px; border-radius:9px; cursor:pointer; margin-left:6px; }
  .btns button:hover, .btns select:hover { border-color:#fbbf24; color:#fbbf24; }
  #board { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; background:linear-gradient(160deg,#2b3a8f,#1e2a6b); padding:10px; border-radius:16px; box-shadow:0 14px 40px #00000066; }
  .cell { aspect-ratio:1; border-radius:50%; background:#101426; cursor:pointer; transition:background .15s ease, transform .1s ease; position:relative; }
  .cell:hover { outline:2px solid #fbbf2488; outline-offset:-2px; }
  .cell.red { background:radial-gradient(circle at 35% 30%, #ff8a80, #d32f2f 70%); }
  .cell.yellow { background:radial-gradient(circle at 35% 30%, #ffe082, #f9a825 70%); }
  .cell.win { box-shadow:0 0 0 3px #fff, 0 0 16px #ffffffcc; }
  #msg { text-align:center; min-height:28px; margin-top:14px; font-size:16.5px; font-weight:700; }
  #msg.good { color:#4ade80; }
  #msg.bad { color:#f87171; }
  #msg.info { color:#6b7699; font-weight:500; }
  footer { text-align:center; color:#49537a; font-size:13px; margin-top:26px; }
  footer a { color:#fbbf24; }
</style>
</head>
<body>
<header>
  <h1>&#128308; Four <span>in a</span> &#128993; Row</h1>
  <p>The classic drop-game, against a minimax AI that actually thinks.</p>
</header>
<div class="wrap">
  <div class="bar">
    <div>you <b id="wins">0</b> &middot; AI <b id="losses">0</b> &middot; draws <b id="draws">0</b></div>
    <div class="btns">
      <select id="mode">
        <option value="hard">vs AI - hard</option>
        <option value="medium">vs AI - medium</option>
        <option value="easy">vs AI - easy</option>
        <option value="human">2 players</option>
      </select>
      <button id="newBtn">New game</button>
    </div>
  </div>
  <div id="board"></div>
  <div id="msg" class="info">You are red. Click a column to drop.</div>
</div>
<footer>Score stays for the session.<br><a href="index.html">&larr; About</a> &nbsp;|&nbsp; Four in a Row &middot; idea #17 from the iLanis App Factory</footer>
<script>
/* ============ engine (headless-testable) ============ */
var COLS=7, ROWS=6;
function emptyBoard(){ var b=[]; for(var i=0;i<ROWS*COLS;i++) b.push(0); return b; }
function dropRow(b,col){ for(var r=ROWS-1;r>=0;r--){ if(!b[r*COLS+col]) return r; } return -1; }
function validCols(b){ var out=[]; for(var c=0;c<COLS;c++) if(!b[c]) out.push(c); return out; }
function play(b,col,player){ var r=dropRow(b,col); if(r<0) return null; var nb=b.slice(); nb[r*COLS+col]=player; return nb; }
function winner(b){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var p=b[r*COLS+c]; if(!p) continue;
    for(var d=0;d<4;d++){
      var dr=dirs[d][0], dc=dirs[d][1], line=[[r,c]];
      for(var k=1;k<4;k++){
        var rr=r+dr*k, cc=c+dc*k;
        if(rr<0||rr>=ROWS||cc<0||cc>=COLS||b[rr*COLS+cc]!==p) break;
        line.push([rr,cc]);
      }
      if(line.length===4) return {player:p, line:line};
    }
  }
  return null;
}
function evalWindow(w,me){
  var opp=me===1?2:1, m=0,o=0,e=0;
  for(var i=0;i<4;i++){ if(w[i]===me)m++; else if(w[i]===opp)o++; else e++; }
  if(m===4) return 100000;
  if(m===3&&e===1) return 60;
  if(m===2&&e===2) return 8;
  if(o===3&&e===1) return -70;
  if(o===4) return -100000;
  return 0;
}
function scoreBoard(b,me){
  var s=0, r,c,d;
  for(r=0;r<ROWS;r++) if(b[r*COLS+3]===me) s+=4; // center preference
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(r=0;r<ROWS;r++) for(c=0;c<COLS;c++){
    for(d=0;d<4;d++){
      var dr=dirs[d][0],dc=dirs[d][1],w=[],ok=true;
      for(var k=0;k<4;k++){
        var rr=r+dr*k,cc=c+dc*k;
        if(rr<0||rr>=ROWS||cc<0||cc>=COLS){ok=false;break;}
        w.push(b[rr*COLS+cc]);
      }
      if(ok) s+=evalWindow(w,me);
    }
  }
  return s;
}
function minimax(b,depth,alpha,beta,maximizing,me){
  var w=winner(b);
  if(w) return {score: w.player===me ? 1000000+depth : -1000000-depth};
  var cols=validCols(b);
  if(depth===0||cols.length===0) return {score:scoreBoard(b,me)};
  // move ordering: center first
  cols.sort(function(a,b2){ return Math.abs(a-3)-Math.abs(b2-3); });
  var bestCol=cols[0];
  if(maximizing){
    var v=-Infinity;
    for(var i=0;i<cols.length;i++){
      var nb=play(b,cols[i],me);
      var res=minimax(nb,depth-1,alpha,beta,false,me);
      if(res.score>v){ v=res.score; bestCol=cols[i]; }
      alpha=Math.max(alpha,v);
      if(alpha>=beta) break;
    }
    return {col:bestCol,score:v};
  } else {
    var opp=me===1?2:1, v2=Infinity;
    for(var j=0;j<cols.length;j++){
      var nb2=play(b,cols[j],opp);
      var res2=minimax(nb2,depth-1,alpha,beta,true,me);
      if(res2.score<v2){ v2=res2.score; bestCol=cols[j]; }
      beta=Math.min(beta,v2);
      if(alpha>=beta) break;
    }
    return {col:bestCol,score:v2};
  }
}
function aiMove(b,me,diff){
  var cols=validCols(b);
  if(diff==='easy'){
    // win if possible, else mostly random
    for(var i=0;i<cols.length;i++){ var nb=play(b,cols[i],me); var w=winner(nb); if(w&&w.player===me) return cols[i]; }
    return Math.random()<0.7 ? cols[Math.floor(Math.random()*cols.length)] : minimax(b,2,-Infinity,Infinity,true,me).col;
  }
  var depth = diff==='medium' ? 4 : 7;
  return minimax(b,depth,-Infinity,Infinity,true,me).col;
}
/* ============ UI ============ */
var board=emptyBoard(), turn=1, over=false, tallies={w:0,l:0,d:0};
function $(id){return document.getElementById(id);}
function setMsg(t,cls){ var m=$('msg'); m.textContent=t; m.className=cls||''; }
function mode(){ return $('mode').value; }
function aiPlayer(){ return 2; }
function draw(){
  var h='';
  for(var i=0;i<ROWS*COLS;i++){
    var cls='cell'+(board[i]===1?' red':board[i]===2?' yellow':'');
    h+='<div class="'+cls+'" data-i="'+i+'"></div>';
  }
  $('board').innerHTML=h;
  document.querySelectorAll('.cell').forEach(function(c){
    c.onclick=function(){
      var i=parseInt(c.getAttribute('data-i'));
      onCol(i%COLS);
    };
  });
  $('wins').textContent=tallies.w; $('losses').textContent=tallies.l; $('draws').textContent=tallies.d;
}
function markWin(line){
  line.forEach(function(rc){ document.querySelector('.cell[data-i="'+(rc[0]*COLS+rc[1])+'"]').classList.add('win'); });
}
function finish(w){
  over=true;
  if(!w){ tallies.d++; setMsg('Board full - draw.','info'); }
  else {
    markWin(w.line);
    var humanWon = mode()==='human' ? false : w.player===1;
    if(mode()==='human'){
      setMsg((w.player===1?'Red':'Yellow')+' wins!','good');
    } else if(w.player===1){ tallies.w++; setMsg('You win! The AI demands a rematch.','good'); }
    else { tallies.l++; setMsg('AI wins this one. Again?','bad'); }
  }
  draw();
}
function onCol(col){
  if(over) return;
  if(mode()!=='human' && turn!==1) return; // not your turn
  var nb=play(board,col,turn);
  if(!nb){ setMsg('That column is full.','bad'); return; }
  board=nb;
  var w=winner(board);
  draw();
  if(w){ finish(w); return; }
  if(validCols(board).length===0){ finish(null); return; }
  turn = turn===1?2:1;
  if(mode()!=='human'){
    setMsg('AI is thinking...','info');
    setTimeout(function(){
      var col2=aiMove(board,aiPlayer(),mode());
      board=play(board,col2,aiPlayer());
      var w2=winner(board);
      draw();
      if(w2){ finish(w2); return; }
      if(validCols(board).length===0){ finish(null); return; }
      turn=1;
      setMsg('Your move.','info');
    }, 350);
  } else {
    setMsg((turn===1?'Red':'Yellow')+' to move.','info');
  }
}
function newGame(){
  board=emptyBoard(); turn=1; over=false;
  draw();
  setMsg(mode()==='human'?'Red starts.':'You are red. Click a column to drop.','info');
}
$('newBtn').onclick=newGame;
$('mode').onchange=newGame;
newGame();
</script>
</body>
</html>
